<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020d3b">
<title>Roulette Tournament Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Gothic+A1:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
/* Layout: fixed 1920x1080 broadcast stage scaled to any screen. Three views driven by the admin: standby ("Now · Round X"), live ranking, buy-in. */
:root{
  color-scheme: dark;
  --ground-0:#020d3b;           /* Roulette KV ground: cosmic violet */
  --ground-1:#0c1162;
  --ground-2:#241a86;
  --gold-hi:#fbe4a2;            /* brand gold gradient */
  --gold-lo:#e2b24b;
  --ruby:#ed1c24;               /* diamond-red: the diamond only */
  --silver-hi:#f4f5fa;
  --silver-lo:#a7aec3;
  --bronze-hi:#f2cfae;
  --bronze-lo:#b47c50;
  --ink:#0b0c22;
  --ink-2:rgba(11,12,34,.62);
  --umber:#6a4a14;
  --text:#ffffff;
  --text-2:rgba(255,255,255,.74);
  --text-3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.10);
  --glass-line:rgba(255,255,255,.16);
  --glass-top:rgba(255,255,255,.11);
  --glass-bot:rgba(255,255,255,.04);
  --thumb:rgba(255,255,255,.96);
  --sheet:rgba(9,12,52,.9);
  --f:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--ground-0);color:var(--text);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

#viewport{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 55% 34% at 50% 60%, rgba(226,178,75,.24), transparent 70%),
    radial-gradient(ellipse 100% 70% at 50% 115%, var(--ground-2), transparent 62%),
    linear-gradient(180deg, var(--ground-0) 0%, var(--ground-1) 58%, #19156f 100%);}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;box-sizing:border-box;
  padding:36px 56px 40px;display:flex;flex-direction:column;gap:22px}
#stage[data-lang="ko"]{font-family:"Montserrat","Gothic A1","Helvetica Neue",Arial,sans-serif}
#stage[data-lang="zh"]{font-family:"Montserrat","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
#stage[data-lang="ja"]{font-family:"Montserrat","Noto Sans SC","Noto Sans JP","Helvetica Neue",Arial,sans-serif}
#stage.cjk h2,#stage.cjk .cap,#stage.cjk .pill,#stage.cjk .stagepill span,#stage.cjk .tl,#stage.cjk .stat small,#stage.cjk .pos-status,#stage.cjk .seat,#stage.cjk .you,#stage.cjk .cut span,#stage.cjk .ov-s,#stage.cjk .sb-sub,#stage.cjk .sb-ready,#stage.cjk .nbbtn,#stage.cjk .bi-unit,#stage.cjk .nbchip{letter-spacing:.06em}
#stage.cjk .ov-k,#stage.cjk .sb-k{letter-spacing:.2em;padding-left:.2em}

.glass{background:linear-gradient(180deg,var(--glass-top),var(--glass-bot));border:1px solid var(--glass-line);border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 30px 80px rgba(0,0,24,.45);
  -webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%)}
.gold-t{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.cap{font-weight:700;font-size:14px;letter-spacing:.3em;color:var(--gold-hi);text-transform:uppercase}
h2{margin:0;font-weight:800;font-size:26px;letter-spacing:.18em;text-transform:uppercase}
.pill{padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;font-size:13px;letter-spacing:.2em;white-space:nowrap;text-transform:uppercase}
.pill.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}
.dmd{display:inline-block;flex:none}

/* ---------- header ---------- */
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;column-gap:18px;align-items:center;height:92px;position:relative;z-index:20}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0;user-select:none;-webkit-user-select:none}
.eyebrow{font-weight:700;font-size:15px;letter-spacing:.36em;color:var(--gold-hi);text-transform:uppercase}
h1{margin:0;font-weight:800;font-size:48px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(180deg,#fff 35%,#c4c9de);-webkit-background-clip:text;background-clip:text;color:transparent}
.stagepill{display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px}
.stagepill span{padding:12px 22px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);white-space:nowrap;transition:background .5s,color .5s}
.stagepill span.on{background:var(--thumb);color:var(--ink);box-shadow:0 6px 18px rgba(0,0,30,.35)}
.stagepill b{font-weight:900}
.gctl{position:relative;display:flex;align-items:center;gap:12px}
.nbbtn{display:flex;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;cursor:pointer;font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  color:var(--gold-hi);border:1.5px solid rgba(251,228,162,.75);background:linear-gradient(180deg,rgba(251,228,162,.24),rgba(251,228,162,.06));animation:nbGlow 2.6s ease-in-out infinite;transition:transform .12s}
.nbbtn:active{transform:scale(.97)}
.nbbtn svg{width:24px;height:24px}
@keyframes nbGlow{50%{box-shadow:0 0 34px rgba(251,228,162,.45)}}
.langp{display:flex;align-items:center;gap:9px;padding:14px 20px;border-radius:999px;cursor:pointer;font-weight:700;font-size:16px;color:var(--text);
  border:1px solid var(--glass-line);background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);white-space:nowrap}
.langp svg{width:22px;height:22px;color:var(--gold-hi)}
.langmenu{position:absolute;right:0;top:calc(100% + 12px);display:grid;gap:6px;padding:10px;border-radius:24px;min-width:220px;z-index:60}
.langmenu button{border:0;border-radius:999px;padding:14px 22px;background:transparent;color:var(--text);font-weight:700;font-size:20px;text-align:left;cursor:pointer}
.langmenu button.on{background:var(--thumb);color:var(--ink)}
.badge{padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.22em;background:var(--thumb);color:var(--ink);display:flex;gap:8px;align-items:center}
.badge.off{background:rgba(255,255,255,.1);color:var(--text-2)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--gold-lo)}

/* ---------- views ---------- */
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.985);transition:opacity .6s ease,transform .6s ease,visibility 0s linear .6s}
.view.on{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease,transform .6s ease,visibility 0s}

/* standby + buy-in */
.stand{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:30px}
.sb-rays{position:absolute;left:50%;top:44%;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;opacity:.55;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(251,228,162,.12) 0deg 4deg,transparent 4deg 14deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 48%);mask:radial-gradient(circle,#000 0%,transparent 48%);animation:spin 60s linear infinite}
.sb-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:1700px}
.sb-k{font-weight:800;font-size:30px;letter-spacing:.5em;padding-left:.5em;color:var(--gold-hi);text-transform:uppercase}
.sb-title{font-weight:900;font-size:200px;line-height:.95;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,#fff 40%,#c4c9de);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-title.sm{font-size:120px;margin-bottom:10px}
.sb-c::before{content:"";position:absolute;left:50%;top:6%;width:1500px;height:520px;margin-left:-750px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(251,228,162,.2),transparent 66%);animation:glowPulse 3.2s ease-in-out infinite}
@keyframes glowPulse{50%{opacity:.55}}
.sb-sub{font-weight:600;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.sb-me{display:flex;align-items:center;gap:12px;padding:12px 28px;border-radius:999px;background:var(--thumb);color:var(--ink);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.sb-me .dmd{width:11px;height:21px}
.sb-rules{display:grid;gap:26px;padding:20px 34px;min-width:880px}
.sb-ready{font-weight:700;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-hi);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.lineup{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:1500px}
.lineup span{display:flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lineup small{font-weight:800;font-size:14px;color:var(--gold-hi);letter-spacing:.1em}
.lineup span.mine{background:var(--thumb);color:var(--ink);border-color:#fff;box-shadow:0 0 40px rgba(251,228,162,.6)}
.lineup span.mine small{color:var(--umber)}
.view.on .lineup span{animation:chipIn .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes chipIn{from{opacity:0;transform:translateY(24px) scale(.8)}to{opacity:1;transform:none}}
.bi-grid{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.bi-tile{width:270px;padding:30px 18px 26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.view.on .bi-tile{animation:chipIn .6s cubic-bezier(.3,1.4,.5,1) both}
.bi-amt{font-weight:800;font-size:56px;font-variant-numeric:tabular-nums}
.bi-arrow{color:var(--gold-hi)}
.bi-arrow svg{width:30px;height:30px;transform:rotate(90deg)}
.bi-cr{font-weight:900;font-size:76px;line-height:1;font-variant-numeric:tabular-nums}
.bi-unit{font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3)}
.bi-max{padding:14px 32px;border-radius:999px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink);font-weight:800;font-size:26px;letter-spacing:.06em}
.bi-icon{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(251,228,162,.14);border:1px solid rgba(251,228,162,.5);color:var(--gold-hi)}
.bi-icon svg{width:50px;height:50px}

/* ---------- live ranking ---------- */
.body{display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:24px;min-height:0}
#stage.is-final .body{grid-template-columns:minmax(0,1fr) 560px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.board{position:relative;display:flex;flex-direction:column;padding:24px 28px 22px;min-height:0;overflow:hidden}
.board::after{content:"";position:absolute;top:0;left:0;width:40%;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);animation:scan 9s ease-in-out infinite;opacity:.8}
@keyframes scan{0%{transform:translateX(-100%)}55%,100%{transform:translateX(260%)}}
.cols,.row,.grid{display:grid;grid-template-columns:76px 250px minmax(0,1fr) 180px 64px;column-gap:18px;align-items:center}
.cols{padding:0 20px;height:30px;margin-top:8px}
.axis{grid-column:3;position:relative;height:100%}
.axis span{position:absolute;top:50%;transform:translate(-50%,-50%);font-weight:500;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.list{position:relative;flex:1;min-height:0;margin-top:6px}
.grid{position:absolute;inset:0;padding:0 21px;pointer-events:none}
.gt{grid-column:3;position:relative;height:100%}
.gt i{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.07)}
.row,.trow{position:absolute;left:0;right:0;top:0;box-sizing:border-box;overflow:hidden;will-change:transform;
  transition:transform .95s cubic-bezier(.22,1,.36,1),background .5s,opacity .5s,height .4s,border-color .5s}
.row{padding:0 20px;border-radius:20px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}
.enter{animation:rowIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowIn{from{opacity:0;translate:-40px 0}}
.rk{font-weight:800;font-size:40px;text-align:center;font-variant-numeric:tabular-nums;color:var(--text-2);line-height:1}
.t1 .rk{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.t2 .rk{background:linear-gradient(180deg,var(--silver-hi),var(--silver-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.t3 .rk{background:linear-gradient(180deg,var(--bronze-hi),var(--bronze-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.pl{display:flex;flex-direction:column;gap:4px;min-width:0}
.pl .top{display:flex;align-items:center;gap:8px;min-width:0}
.mem{font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat{font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--text-3);text-transform:uppercase}
.you{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--ink);color:var(--gold-hi);font-weight:800;font-size:11px;letter-spacing:.2em;flex:none;text-transform:uppercase}
.you .dmd{width:8px;height:15px}
.nbchip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid rgba(251,228,162,.6);color:var(--gold-hi);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;flex:none;white-space:nowrap}
.nbchip svg{width:13px;height:13px}
.me .nbchip{color:var(--umber);border-color:var(--umber)}
.track{position:relative;height:40%;min-height:16px;max-height:30px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(225,230,255,.55));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.zone .fill{background:linear-gradient(90deg,rgba(251,228,162,.08),var(--gold-hi) 72%,var(--gold-lo))}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.val{text-align:right;font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;white-space:nowrap}
.zone .val{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.mv{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--text-3)}
.mv svg{width:14px;height:14px}
.mv.rise{color:var(--gold-hi)}
.dimr{opacity:.6}
.row.t1{background:linear-gradient(90deg,rgba(251,228,162,.16),rgba(255,255,255,.04) 60%);border-color:rgba(251,228,162,.38);box-shadow:0 0 40px rgba(226,178,75,.16)}
.me{background:var(--thumb)!important;border-color:#fff!important;color:var(--ink);opacity:1!important;animation:mePulse 2.6s ease-in-out infinite}
.me.enter{animation:rowIn .7s cubic-bezier(.2,.8,.2,1) both,mePulse 2.6s .7s ease-in-out infinite}
.me .rk,.me .val,.me .tval{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:var(--ink)!important}
.me .seat,.me .rtag{color:var(--ink-2)}
.me .rtag{background:rgba(11,12,34,.08)}
.me .track{background:rgba(11,12,34,.08)}
.me .fill{background:linear-gradient(90deg,rgba(226,178,75,.2),var(--gold-lo))!important}
.me .mv,.me .mv.rise{color:var(--umber)}
@keyframes mePulse{0%,100%{box-shadow:0 0 0 2px rgba(251,228,162,.9),0 0 30px rgba(251,228,162,.3)}50%{box-shadow:0 0 0 3px rgba(251,228,162,1),0 0 70px rgba(251,228,162,.6)}}
.climb::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(100deg,transparent 25%,rgba(251,228,162,.7) 50%,transparent 75%);transform:translateX(-120%);animation:sweep 1.3s .35s ease-out forwards}
.climb{animation:upGlow 2.4s ease-out}
.me.climb{animation:upGlow 2.4s ease-out,mePulse 2.6s 2.4s ease-in-out infinite}
.climb .rk{animation:rkPop .9s .45s cubic-bezier(.3,1.7,.5,1)}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes upGlow{0%{box-shadow:0 0 0 0 rgba(251,228,162,0)}22%{box-shadow:0 0 0 3px rgba(251,228,162,1),0 0 80px rgba(251,228,162,.7)}100%{box-shadow:0 0 0 0 rgba(251,228,162,0)}}
@keyframes rkPop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.cut{position:absolute;left:10px;right:10px;height:0;border-top:2px dashed rgba(251,228,162,.6);z-index:3;pointer-events:none;transition:top .6s cubic-bezier(.22,1,.36,1)}
.cut span{position:absolute;left:50%;top:-13px;transform:translateX(-50%);padding:5px 14px;border-radius:999px;white-space:nowrap;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink);font-weight:800;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.empty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;color:var(--text-2);font-size:18px}
.empty b{font-weight:800;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}

.side{display:flex;flex-direction:column;gap:20px;min-height:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:220px;flex:none}
.duo.solo{grid-template-columns:1fr}
#stage.is-final .duo{grid-template-columns:1fr;height:auto;flex:1;min-height:0;grid-template-rows:minmax(0,1fr) auto}
#stage.is-final .duo.solo{grid-template-rows:1fr}
.spin{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:18px 24px;overflow:hidden;min-height:0}
.spin::before{content:"";position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(251,228,162,.22),transparent 62%);pointer-events:none}
.spin-n{position:relative;display:flex;align-items:baseline;gap:10px;line-height:.85}
.spin-n b{font-weight:900;font-size:128px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.spin-n span{font-weight:600;font-size:38px;color:var(--text-3)}
#stage.is-final .spin-n b{font-size:230px}
#stage.is-final .spin-n span{font-size:56px}
.spin.bump .spin-n b{animation:spinBump .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes spinBump{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.pips{position:relative;display:flex;gap:6px;margin-top:6px}
.pips i{width:24px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.pips i.done{background:linear-gradient(90deg,var(--gold-hi),var(--gold-lo))}
.pips i.now{background:var(--gold-hi);animation:pip 1.4s ease-in-out infinite}
@keyframes pip{50%{opacity:.35}}
.pos{position:relative;padding:20px 24px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:0}
.pos::before{content:"";position:absolute;right:-90px;top:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(251,228,162,.28),transparent 65%);pointer-events:none}
.pos-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pos-mem{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.pos-stats{position:relative;display:flex;gap:28px;align-items:flex-end}
.stat small{display:block;font-weight:600;font-size:11px;letter-spacing:.24em;color:var(--text-3);margin-bottom:6px;text-transform:uppercase}
.stat b{display:block;font-weight:900;font-size:62px;line-height:.85;font-variant-numeric:tabular-nums}
.stat.sm b{font-size:40px;color:var(--text)}
.pos-status{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pos-status.in{background:linear-gradient(90deg,rgba(251,228,162,.26),rgba(251,228,162,.08));color:var(--gold-hi);border:1px solid rgba(251,228,162,.45)}
.pos-status.outz{background:rgba(255,255,255,.07);color:var(--text-2);border:1px solid var(--glass-line)}
.pos-status .dmd{width:8px;height:15px}
.pos-none{position:relative;font-size:18px;color:var(--text-2);line-height:1.4}
.nbcard{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;justify-content:space-between;
  border:1.5px solid rgba(251,228,162,.65);background:linear-gradient(150deg,rgba(251,228,162,.24),rgba(251,228,162,.04) 62%),linear-gradient(180deg,var(--glass-top),var(--glass-bot));
  animation:nbGlow 2.6s ease-in-out infinite;transition:transform .12s}
.nbcard:active{transform:scale(.98)}
.nb-main{position:relative;display:flex;align-items:center;gap:20px}
.nb-ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink);box-shadow:0 0 34px rgba(251,228,162,.5)}
.nb-ic svg{width:46px;height:46px}
.nb-txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.nb-t{font-weight:900;font-size:28px;line-height:1.1;text-transform:uppercase;letter-spacing:.04em}
.nb-s{font-weight:600;font-size:15px;color:var(--text-2)}
#stage.is-final .nb-ic{width:104px;height:104px}#stage.is-final .nb-ic svg{width:56px;height:56px}#stage.is-final .nb-t{font-size:34px}
.pos.flash{animation:meFlash 1.6s ease-out}
@keyframes meFlash{25%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 3px rgba(251,228,162,.95),0 0 80px rgba(251,228,162,.55)}}
.topcard{position:relative;flex:1;display:flex;flex-direction:column;padding:20px 24px 16px;min-height:0;overflow:hidden}
#stage.is-final .topcard{display:none}
.tlist{position:relative;flex:1;min-height:0;margin-top:12px}
.trow{display:grid;grid-template-columns:52px minmax(0,1fr) 60px 170px;column-gap:14px;align-items:center;padding:0 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.trow .rk{font-size:28px}
.trow .mem{font-size:26px;display:flex;align-items:center;gap:10px}
.trow .ldot{width:8px;height:8px;border-radius:50%;background:var(--gold-hi);flex:none;animation:ldot 1.8s ease-out infinite}
@keyframes ldot{0%{box-shadow:0 0 0 0 rgba(251,228,162,.75)}100%{box-shadow:0 0 0 12px rgba(251,228,162,0)}}
.rtag{justify-self:center;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--text-2)}
.tval{text-align:right;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.trow.t1{background:linear-gradient(90deg,rgba(251,228,162,.16),rgba(255,255,255,.04) 70%);border-color:rgba(251,228,162,.35)}
.rulecard{flex:none;padding:18px 20px;display:grid;gap:8px;align-items:start}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.ri{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--gold-hi)}
.ri svg{width:23px;height:23px}
.tv{font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tv.long{font-size:16px}
.tl{font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sb-rules .ri{width:58px;height:58px}.sb-rules .ri svg{width:30px;height:30px}
.sb-rules .tv{font-size:30px}.sb-rules .tl{font-size:13px}

/* ---------- overlays ---------- */
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:35}
.ov{position:absolute;inset:0;z-index:30;display:grid;place-items:center;overflow:hidden;pointer-events:none;transition:opacity .45s}
.ov.fade{opacity:0}
.ov-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,14,70,.55),rgba(2,6,32,.94) 72%);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0}
.ov-rays{position:absolute;left:50%;top:50%;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(251,228,162,.17) 0deg 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 52%);mask:radial-gradient(circle,#000 0%,transparent 52%)}
.ov-ring{position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;opacity:0;border:3px solid rgba(251,228,162,.95);box-shadow:0 0 40px rgba(251,228,162,.7),inset 0 0 40px rgba(251,228,162,.45)}
.ov-flare{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;opacity:0;background:linear-gradient(90deg,transparent,rgba(251,228,162,0) 10%,#fff 50%,rgba(251,228,162,0) 90%,transparent);box-shadow:0 0 30px 6px rgba(251,228,162,.6)}
.ov-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;max-width:1700px}
.ov-k{display:flex;align-items:center;gap:22px;font-weight:800;font-size:34px;letter-spacing:.5em;padding-left:.5em;color:var(--gold-hi);text-transform:uppercase;opacity:0}
.ov-k svg{width:34px;height:34px}
.ov-m{display:flex;align-items:center;gap:44px;opacity:0}
.ov-m .from{font-weight:800;font-size:150px;line-height:1;color:rgba(255,255,255,.32);font-variant-numeric:tabular-nums}
.ov-m .to{font-weight:900;font-size:320px;line-height:.82;font-variant-numeric:tabular-nums;letter-spacing:-.02em;background:linear-gradient(180deg,#fff7dc 0%,var(--gold-hi) 35%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov-m .of{font-weight:700;font-size:110px;color:rgba(255,255,255,.4);align-self:flex-end;margin-bottom:20px;margin-left:-28px;font-variant-numeric:tabular-nums}
.ov-m .lbl{font-weight:900;font-size:130px;line-height:1;text-transform:uppercase;background:linear-gradient(180deg,#fff 40%,#c4c9de);-webkit-background-clip:text;background-clip:text;color:transparent;align-self:center}
.ov-m .arrow{display:flex}
.ov-m .arrow svg{width:64px;height:64px;color:var(--gold-hi);opacity:.2;animation:chev 1s ease-in-out infinite}
.ov-m .arrow svg:nth-child(2){animation-delay:.15s}.ov-m .arrow svg:nth-child(3){animation-delay:.3s}
@keyframes chev{40%{opacity:1}}
.ov-m .big{font-weight:900;font-size:230px;line-height:.86;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 40%,#c4c9de);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov-m .title{font-weight:900;font-size:120px;line-height:1.02;text-transform:uppercase;background:linear-gradient(180deg,#fff 40%,#c4c9de);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:1600px}
.ov-m .dmd{width:92px;height:176px;filter:drop-shadow(0 0 30px rgba(251,228,162,.7))}
.ov-m .nbic{width:150px;height:150px;color:var(--gold-hi);filter:drop-shadow(0 0 30px rgba(251,228,162,.6))}
.ov-s{font-weight:600;font-size:26px;letter-spacing:.16em;color:var(--text-2);text-transform:uppercase;opacity:0}
.ov-s b{color:var(--gold-hi);font-weight:800}
.ov-badge{padding:10px 26px;border-radius:999px;background:var(--thumb);color:var(--ink);font-weight:800;font-size:22px;letter-spacing:.2em;text-transform:uppercase;opacity:0}
.ov.play .ov-bg{animation:fadeIn .4s forwards}
.ov.play .ov-rays{animation:raysIn .9s .1s forwards,spin 22s linear infinite}
.ov.play .ov-ring{animation:ring 1.5s .15s cubic-bezier(.2,.8,.2,1) forwards}
.ov.play .ov-ring.r2{animation-delay:.5s}
.ov.play .ov-flare{animation:flare 1.1s .25s ease-out forwards}
.ov.play .ov-k{animation:kIn .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
.ov.play .ov-m{animation:mIn .9s .35s cubic-bezier(.3,1.45,.5,1) forwards}
.ov.play .ov-s{animation:sIn .6s .75s ease-out forwards}
.ov.play .ov-badge{animation:sIn .6s .9s ease-out forwards}
.ov.quick.play .ov-k{animation-delay:0s;animation-duration:.5s}
.ov.quick.play .ov-m{animation-delay:.12s;animation-duration:.6s}
.ov.quick.play .ov-s{animation-delay:.35s}
@keyframes fadeIn{to{opacity:1}}
@keyframes raysIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(4.2)}}
@keyframes flare{0%{opacity:0;transform:scaleX(.1)}30%{opacity:1}100%{opacity:0;transform:scaleX(1.2)}}
@keyframes kIn{from{opacity:0;filter:blur(10px);transform:scale(1.3)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes mIn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes sIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* no-bet confirm (guest) */
.modal{position:absolute;inset:0;z-index:45;display:grid;place-items:center;background:rgba(2,6,32,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal-card{width:800px;padding:50px 56px 44px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;animation:chipIn .45s cubic-bezier(.3,1.4,.5,1)}
.modal-card .nbic{width:96px;height:96px;color:var(--gold-hi)}
.modal-card h3{margin:0;font-weight:800;font-size:46px;line-height:1.15}
.modal-card p{margin:0;font-size:24px;color:var(--text-2)}
.modal-btns{display:flex;gap:18px;margin-top:12px}
.mbtn{border:0;border-radius:999px;padding:22px 44px;font-weight:800;font-size:24px;cursor:pointer;background:rgba(255,255,255,.14);color:var(--text);transition:transform .12s}
.mbtn:active{transform:scale(.97)}
.mbtn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}

/* ---------- controls ---------- */
.ctrl{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:20;opacity:0;transition:opacity .4s;pointer-events:none}
.ctrl.show{opacity:1;pointer-events:auto}
.cbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--glass-line);background:rgba(20,22,80,.6);color:var(--text);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .12s}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:22px;height:22px}

/* ---------- welcome, rules intro, no-bet states ---------- */
.brand-row{display:flex;align-items:center;gap:18px;min-width:0}
.mbpill{flex:none;padding:8px 16px;border-radius:999px;background:var(--thumb);color:var(--ink);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sb-name{font-weight:900;line-height:1.02;white-space:nowrap;padding:0 .05em;
  background:linear-gradient(180deg,#fff7dc 0%,var(--gold-hi) 42%,var(--gold-lo) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.view.on .sb-name{animation:nameIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes nameIn{from{opacity:0;transform:translateY(28px) scale(.92)}to{opacity:1;transform:none}}
.sb-round{padding:12px 26px;border-radius:999px;border:1px solid rgba(251,228,162,.5);color:var(--gold-hi);font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.rl-grid{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.rl-tile{width:272px;box-sizing:border-box;padding:36px 18px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transition:box-shadow .6s,border-color .6s,background .6s}
.view.on .rl-tile{animation:chipIn .75s cubic-bezier(.3,1.4,.5,1) both}
.rl-tile .ri{width:104px;height:104px;transition:transform .6s cubic-bezier(.3,1.5,.5,1),background .6s}
.rl-tile .ri svg{width:54px;height:54px}
.rl-tile .tv{font-size:60px;white-space:nowrap}
.rl-tile .tv.long{font-size:42px}
.rl-tile .tl{font-size:18px;white-space:normal;line-height:1.3}
.rl-tile.spot{border-color:rgba(251,228,162,.95);background:linear-gradient(180deg,rgba(251,228,162,.22),rgba(251,228,162,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px rgba(251,228,162,.6),0 0 90px rgba(251,228,162,.45)}
.rl-tile.spot .ri{transform:scale(1.14);background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}
.rl-tile.spot .tl{color:var(--text)}
.nbcard.active{cursor:default;color:var(--ink);border-color:#fff;background:linear-gradient(160deg,#fff6d6,var(--gold-hi) 45%,var(--gold-lo));animation:nbActive 1.3s ease-in-out infinite}
.nbcard.active .cap,.nbcard.active .pos-mem{color:var(--umber)}
.nbcard.active .nb-s{color:var(--ink);font-weight:800}
.nbcard.active .nb-ic{background:var(--ink);color:var(--gold-hi);box-shadow:none}
.nbcard.active::before{display:none}
@keyframes nbActive{0%,100%{box-shadow:0 0 0 3px rgba(251,228,162,.5),0 0 50px rgba(251,228,162,.45)}50%{box-shadow:0 0 0 6px rgba(251,228,162,.75),0 0 110px rgba(251,228,162,.8)}}
.nbcard.used{cursor:default;opacity:.42;filter:saturate(.3);animation:none;border-color:var(--glass-line);background:linear-gradient(180deg,var(--glass-top),var(--glass-bot))}
.nbcard.used .nb-ic{background:rgba(255,255,255,.14);color:var(--text-2);box-shadow:none}
.nbcard:disabled:active{transform:none}
.lk{grid-column:1/-1;font-size:12px;color:var(--text-3);margin:-2px 0 4px 86px}
.lk.ok{color:var(--gold-hi)}
.lk.bad{color:#ffd0c4}

/* ---------- prize ranking (after the Final) ---------- */
#stage[data-mode="awards"] .hud{display:none}
.awards{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;overflow:hidden}
.aw-rays{position:absolute;left:50%;top:33%;width:2800px;height:2800px;margin:-1400px 0 0 -1400px;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(251,228,162,.15) 0deg 4deg,transparent 4deg 13deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 44%);mask:radial-gradient(circle,#000 0%,transparent 44%)}
.view.on .aw-rays{animation:raysIn 1.4s 4.2s forwards,spin 60s linear infinite}
.aw-title{position:relative;font-weight:800;font-size:34px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--gold-hi);white-space:nowrap}
.view.on .aw-title{animation:sIn .8s .1s both}
.podium{position:relative;display:grid;grid-template-columns:480px 580px 480px;gap:34px;align-items:end;justify-content:center;width:100%;flex:1;min-height:0}
.pcol{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pcol .spot{position:absolute;left:50%;bottom:0;width:150%;height:150%;margin-left:-75%;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 34% 62% at 50% 0%,rgba(255,244,214,.26),rgba(255,244,214,.06) 60%,transparent 75%)}
.pdrop{position:relative;z-index:2}
.pbadge{position:relative;width:236px;aspect-ratio:504/460;animation:floaty 4.6s ease-in-out infinite}
.pcol.c1 .pbadge{width:304px}
.pbadge img{display:block;width:100%;height:100%;object-fit:contain}
.pbadge .shine{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:160% 0;animation:shine 4.2s ease-in-out infinite}
.pcol.c1 .pbadge .shine{animation-duration:3.2s}
@keyframes floaty{50%{transform:translateY(-10px)}}
@keyframes shine{0%,55%{background-position:160% 0}100%{background-position:-60% 0}}
.pcol.c1 .pdrop::before{content:"";position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(251,228,162,.5),rgba(251,228,162,.12) 45%,transparent 68%);animation:halo 2.8s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.12);opacity:.7}}
.pwho{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:8px;max-width:100%}
.pname{font-weight:800;font-size:38px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pcol.c1 .pname{font-size:50px}
.pname.dim{color:var(--text-3)}
.pmb{font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--text-2);font-variant-numeric:tabular-nums;min-height:20px}
.pcol .you{margin-top:4px}
.ped{position:relative;width:100%;box-sizing:border-box;margin-top:16px;border-radius:30px 30px 0 0;border-bottom:0;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;height:168px;overflow:hidden}
.pcol.c1 .ped{height:226px;border-color:rgba(251,228,162,.65);background:linear-gradient(180deg,rgba(251,228,162,.28),rgba(251,228,162,.05) 70%)}
.pcol.c2 .ped{border-color:rgba(232,160,112,.55);background:linear-gradient(180deg,rgba(232,160,112,.22),rgba(232,160,112,.04) 70%)}
.pcol.c3 .ped{border-color:rgba(214,220,232,.55);background:linear-gradient(180deg,rgba(214,220,232,.2),rgba(214,220,232,.04) 70%)}
.ped::after{content:"";position:absolute;top:0;left:0;width:40%;height:2px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:scan 5s ease-in-out infinite}
.plabel{padding:8px 20px;border-radius:999px;font-weight:900;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.c1 .plabel{background:linear-gradient(180deg,#fff3c4,var(--gold-lo));font-size:20px}
.c2 .plabel{background:linear-gradient(180deg,#f6c8a4,#c47a48)}
.c3 .plabel{background:linear-gradient(180deg,#ffffff,#b9bfcc)}
.pprize{font-weight:900;font-size:62px;line-height:1;font-variant-numeric:tabular-nums;-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.c1 .pprize{font-size:86px;background-image:linear-gradient(180deg,#fff7dc,var(--gold-hi) 40%,var(--gold-lo))}
.c2 .pprize{background-image:linear-gradient(180deg,#ffe2cc,#e8a070 50%,#b8693a)}
.c3 .pprize{background-image:linear-gradient(180deg,#ffffff,#d6dce8 50%,#9aa1b2)}
.ptype{font-weight:700;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2)}
.pcol.mine .pname{color:var(--gold-hi)}
/* staged reveal: 5th → 4th → runner-up 2 → runner-up 1 → champion */
.view.on .tier.t5{animation:tierIn .8s .5s cubic-bezier(.2,.8,.2,1) both}
.view.on .tier.t4{animation:tierIn .8s .9s cubic-bezier(.2,.8,.2,1) both}
.view.on .c3 .ped{animation:pedUp .9s 1.6s cubic-bezier(.2,.9,.25,1) both}
.view.on .c3 .pdrop{animation:dropIn 1s 1.9s cubic-bezier(.3,1.5,.5,1) both}
.view.on .c3 .pwho{animation:sIn .7s 2.2s both}
.view.on .c3 .spot{animation:fadeIn .8s 1.8s forwards}
.view.on .c2 .ped{animation:pedUp .9s 2.7s cubic-bezier(.2,.9,.25,1) both}
.view.on .c2 .pdrop{animation:dropIn 1s 3s cubic-bezier(.3,1.5,.5,1) both}
.view.on .c2 .pwho{animation:sIn .7s 3.3s both}
.view.on .c2 .spot{animation:fadeIn .8s 2.9s forwards}
.view.on .c1 .ped{animation:pedUp 1s 4s cubic-bezier(.2,.9,.25,1) both}
.view.on .c1 .pdrop{animation:champIn 1.4s 4.3s cubic-bezier(.25,1.35,.4,1) both}
.view.on .c1 .pwho{animation:sIn .8s 5s both}
.view.on .c1 .spot{animation:fadeIn 1s 4.2s forwards}
.view.on .c1 .plabel{animation:labelIn .9s 4.6s cubic-bezier(.2,.8,.2,1) both}
.view.on .aw-msg{animation:sIn 1s 6.2s both}
@keyframes tierIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pedUp{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:none}}
@keyframes dropIn{0%{opacity:0;transform:translateY(-320px) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes champIn{0%{opacity:0;transform:scale(.15) rotateY(540deg)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes labelIn{from{opacity:0;letter-spacing:.9em}to{opacity:1;letter-spacing:.24em}}
.tiers{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;width:100%}
.tier{display:grid;grid-template-columns:104px minmax(0,1fr);gap:22px;align-items:center;padding:16px 26px;border-radius:28px;min-height:132px;box-sizing:border-box}
.tier>img{width:104px;animation:floaty 5s ease-in-out infinite}
.tier-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tier-l{font-weight:900;font-size:22px;letter-spacing:.16em;text-transform:uppercase}
.tier-p{font-weight:900;font-size:36px;font-variant-numeric:tabular-nums;-webkit-background-clip:text;background-clip:text;color:transparent}
.t4 .tier-p{background-image:linear-gradient(90deg,#62b8ff,#5ce08a)}
.t5 .tier-p{background-image:linear-gradient(90deg,#ff9ccc,#f2f2ff)}
.t4{border-color:rgba(98,184,255,.4)}.t5{border-color:rgba(255,156,204,.4)}
.tier-t{font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchips span{display:flex;align-items:baseline;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-weight:800;font-size:20px;white-space:nowrap}
.tchips small{font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--text-3)}
.tchips span.mine{background:var(--thumb);color:var(--ink)}
.tchips span.mine small{color:var(--ink-2)}
.view.on .tchips span{animation:chipIn .5s cubic-bezier(.3,1.5,.5,1) both}
.aw-msg{position:relative;font-weight:700;font-size:26px;letter-spacing:.04em;color:var(--text);text-align:center}
.aw-msg b{color:var(--gold-hi)}
/* after the reveal, prize or score edits update in place without replaying the entrance */
.awards.settled .aw-title,.awards.settled .tier,.awards.settled .ped,.awards.settled .pdrop,.awards.settled .pwho,.awards.settled .plabel,.awards.settled .aw-msg,.awards.settled .tchips span{animation:none!important}
.awards.settled .pcol .spot{animation:none!important;opacity:1}
#stage.cjk .aw-title{letter-spacing:.2em;padding-left:.2em}
#stage.cjk .plabel,#stage.cjk .tier-l,#stage.cjk .ptype{letter-spacing:.08em}

/* ---------- audience big screen ---------- */
.pl .sub{display:flex;align-items:center;gap:10px;min-width:0}
.vcol{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;min-width:0}
.dl,.prz,.gap,.spin-tag,.leadcard,.recap{display:none}
#stage.aud .gctl{display:none}
.stagepill .lv{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 14px;font-weight:900;font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi);white-space:nowrap}
.stagepill .lv i{width:10px;height:10px;border-radius:50%;background:var(--gold-hi);animation:ldot 1.6s ease-out infinite}
#stage.aud .body,#stage.aud.is-final .body{grid-template-columns:minmax(0,1fr) 600px}
#stage.aud .cols,#stage.aud .row,#stage.aud .grid{grid-template-columns:76px 380px minmax(0,1fr) 200px 60px}
#stage.aud .gap{display:block;font-weight:700;font-size:15px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
#stage.aud .dl:not(:empty){display:inline-flex}
#stage.aud .prz:not(:empty){display:inline-flex}
.dl{align-items:center;gap:5px;padding:4px 11px;border-radius:999px;font-weight:800;font-size:16px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.dl svg{width:15px;height:15px}
.dl.up{background:rgba(251,228,162,.14);color:var(--gold-hi);border:1px solid rgba(251,228,162,.45)}
.dl.down{background:rgba(255,255,255,.06);color:var(--text-3);border:1px solid rgba(255,255,255,.14)}
.dl.hot{background:linear-gradient(180deg,#fff3c4,var(--gold-hi) 45%,var(--gold-lo));color:var(--ink);border:1px solid #fff;animation:hotGlow 1.6s ease-in-out infinite}
.dl.pop{animation:dlPop .8s cubic-bezier(.3,1.6,.5,1) both}
.dl.hot.pop{animation:dlPop .8s cubic-bezier(.3,1.6,.5,1) both,hotGlow 1.6s .8s ease-in-out infinite}
@keyframes dlPop{0%{opacity:0;transform:scale(.3) translateY(10px)}100%{opacity:1;transform:none}}
@keyframes hotGlow{0%,100%{box-shadow:0 0 12px rgba(251,228,162,.35)}50%{box-shadow:0 0 30px rgba(251,228,162,.9)}}
.prz{align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-weight:900;font-size:15px;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;color:var(--ink)}
.prz .dmd{width:7px;height:13px}
.prz.pz-champ{background:linear-gradient(180deg,#fff3c4,var(--gold-lo));box-shadow:0 0 18px rgba(251,228,162,.45)}
.prz.pz-ru1{background:linear-gradient(180deg,#f6c8a4,#c47a48)}
.prz.pz-ru2{background:linear-gradient(180deg,#ffffff,#b9bfcc)}
.prz.pz-p4{background:linear-gradient(90deg,#7cc4ff,#6fe39a)}
.prz.pz-p5{background:linear-gradient(90deg,#ffa8d2,#f3e3ff)}
.prz.pz-zone{background:rgba(251,228,162,.12);color:var(--gold-hi);border:1px solid rgba(251,228,162,.45);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:4px 11px}
.prz.bump{animation:dlPop .8s cubic-bezier(.3,1.6,.5,1) both}
/* side: spin, leader, top players (qualifying) or spin recap (Final) */
#stage.aud .rulecard{display:none}
#stage.aud:not(.is-final) .duo{height:200px}
#stage.aud:not(.is-final) .spin-n b{font-size:92px}
#stage.aud:not(.is-final) .spin-n span{font-size:30px}
#stage.aud.is-final .spin-n b{font-size:200px}
#stage.aud .spin-tag:not(:empty){display:block;position:relative;margin-top:8px;padding:7px 18px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.28em;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,#fff3c4,var(--gold-hi) 45%,var(--gold-lo));color:var(--ink);animation:tagPulse 1.2s ease-in-out infinite}
@keyframes tagPulse{0%,100%{box-shadow:0 0 0 rgba(251,228,162,0);transform:none}50%{box-shadow:0 0 32px rgba(251,228,162,.85);transform:scale(1.05)}}
#stage.aud .leadcard{display:flex}
.leadcard{position:relative;flex:none;flex-direction:column;gap:4px;height:210px;box-sizing:border-box;padding:18px 26px;overflow:hidden}
.leadcard::before{content:"";position:absolute;right:-120px;top:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(251,228,162,.3),transparent 65%);pointer-events:none}
.lc-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.lc-top .cap{display:flex;align-items:center;gap:10px}
.lc-top .cap svg{width:22px;height:22px}
.lc-tag{padding:6px 13px;border-radius:999px;font-weight:900;font-size:12px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;background:linear-gradient(180deg,#fff3c4,var(--gold-hi) 45%,var(--gold-lo));color:var(--ink);animation:tagPulse 1.2s ease-in-out infinite}
.lc-name{position:relative;font-weight:900;font-size:48px;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.lc-meta{position:relative;font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--text-3);text-transform:uppercase;white-space:nowrap;min-height:16px}
.lc-row{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:auto}
.lc-score{font-weight:900;font-size:50px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.lc-lead{font-weight:700;font-size:17px;color:var(--text-2);white-space:nowrap}
.lc-lead b{color:var(--gold-hi);font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.leadcard.close{border-color:rgba(251,228,162,.7);animation:closeBeat 1.4s ease-in-out infinite}
@keyframes closeBeat{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px rgba(0,0,24,.45)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px rgba(0,0,24,.45),0 0 0 2px rgba(251,228,162,.8),0 0 60px rgba(251,228,162,.35)}}
.leadcard.swap{animation:lcSwap 1.4s cubic-bezier(.2,.8,.2,1)}
.leadcard.swap .lc-name,.leadcard.swap .lc-row{animation:lcIn .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes lcSwap{0%{box-shadow:0 0 0 4px #fff,0 0 120px rgba(251,228,162,.9)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px rgba(0,0,24,.45)}}
@keyframes lcIn{from{opacity:0;transform:translateY(22px) scale(.92)}to{opacity:1;transform:none}}
#stage.aud .trow .rk{font-size:22px}
#stage.aud .trow .mem{font-size:21px;min-width:0}
#stage.aud .trow .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#stage.aud .tval{font-size:22px}
#stage.aud.is-final .recap{display:flex}
.recap{flex:none;flex-direction:column;gap:10px;padding:20px 24px;box-sizing:border-box}
.rc-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.rc-row .rk{font-size:24px}
.rc-nm{font-weight:800;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap .dl{display:inline-flex}
.rc-wait{color:var(--text-3);font-size:16px;line-height:1.5;padding:4px 2px}
/* last spin: the board's frame breathes gold */
#stage.aud.clutch .board{animation:clutch 1.6s ease-in-out infinite}
@keyframes clutch{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px rgba(0,0,24,.45),0 0 0 1px rgba(251,228,162,.2)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 30px 80px rgba(0,0,24,.45),0 0 0 2px rgba(251,228,162,.85),0 0 80px rgba(251,228,162,.32)}}
.ov.spin.last .ov-s{color:var(--gold-hi);font-weight:900;font-size:40px;letter-spacing:.34em}
.ov.spin.last .ov-ring{border-width:6px}
.ov-m .big.nm{line-height:1.12;letter-spacing:-.01em;white-space:nowrap}
/* lower-third callouts */
.callout{position:absolute;left:56px;bottom:62px;z-index:26;display:flex;align-items:center;gap:20px;max-width:1180px;box-sizing:border-box;padding:14px 34px 14px 14px;border-radius:999px;overflow:hidden;pointer-events:none;
  background:linear-gradient(90deg,rgba(16,18,78,.95),rgba(36,28,120,.92));border:1px solid rgba(251,228,162,.6);box-shadow:0 26px 70px rgba(0,0,20,.6),0 0 60px rgba(251,228,162,.2);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.callout[hidden]{display:none}
.callout::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(251,228,162,.35) 50%,transparent 70%);transform:translateX(-110%);pointer-events:none}
.callout.in{animation:coIn .75s cubic-bezier(.2,.9,.25,1) both}
.callout.in::after{animation:sweep 1.2s .35s ease-out forwards}
.callout.out{animation:coOut .45s ease-in both}
@keyframes coIn{from{opacity:0;transform:translateX(-90px) scale(.96)}to{opacity:1;transform:none}}
@keyframes coOut{to{opacity:0;transform:translateY(30px)}}
.co-ic{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(180deg,#fff3c4,var(--gold-hi) 45%,var(--gold-lo));color:var(--ink);box-shadow:0 0 30px rgba(251,228,162,.5)}
.co-ic svg{width:34px;height:34px}
.co-ic .dmd{width:17px;height:33px}
.co-t{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.co-k{font-weight:800;font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-hi);white-space:nowrap}
.co-m{display:flex;align-items:baseline;gap:18px;font-weight:900;font-size:38px;line-height:1.15;white-space:nowrap;min-width:0}
.co-m .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.co-m .v{flex:none;font-variant-numeric:tabular-nums}
#stage.cjk .co-k,#stage.cjk .lc-tag,#stage.cjk .spin-tag,#stage.cjk .lc-meta,#stage.cjk .stagepill .lv,#stage.cjk .prz.pz-zone{letter-spacing:.08em}

/* ---------- min bet, buy-in range ---------- */
.ov.spin .ov-badge{display:flex;align-items:baseline;gap:18px;padding:14px 38px;font-size:28px;letter-spacing:.2em}
.ov.spin .ov-badge b{font-weight:900;font-size:46px;letter-spacing:0;font-variant-numeric:tabular-nums}
.ov.quick.play .ov-badge{animation-delay:.45s}
#stage.cjk .ov.spin .ov-badge{letter-spacing:.08em}
.spin-foot{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;flex-wrap:nowrap}
.spin-mb{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.spin-mb:empty{display:none}
.spin-mb b{font-weight:900;font-size:22px;letter-spacing:.01em;color:var(--gold-hi);font-variant-numeric:tabular-nums}
#stage.is-final .spin-mb{font-size:18px}#stage.is-final .spin-mb b{font-size:32px}
#stage:not(.is-final):not(.aud) .spin-n b{font-size:112px}
#stage.aud .spin-foot .spin-tag:not(:empty){margin-top:0}
#stage.aud:not(.is-final) .duo{height:214px}
#stage.cjk .spin-mb{letter-spacing:.06em}
.bi-rate{font-weight:800;font-size:30px;letter-spacing:.04em;color:var(--text);font-variant-numeric:tabular-nums}
/* ---------- admin: import, buy-in panel, min bet ---------- */
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.impbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.btn{display:inline-flex;align-items:center;gap:8px}
label.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.imp-prev{border-color:rgba(251,228,162,.45)}
.imp-k{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--text-2)}
.imp-k b{color:var(--text);font-size:15px}
.imp-row{display:grid;grid-template-columns:40px 112px minmax(0,1fr) 40px;gap:8px;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}
.imp-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-row .mono{font-variant-numeric:tabular-nums;font-weight:700}
.imp-row .dim{color:var(--text-3)}
textarea.inp{resize:vertical;min-height:120px;font-size:13px;line-height:1.45;white-space:pre}
.bipanel{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.bigrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bigrid label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.spinrow .spcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.spinrow .spcol small{font-size:11px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
.mbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.mbgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
@media (max-width:480px){.bigrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.ov.biclose .ov-m{flex-direction:column;gap:26px}
.ov.biclose .ov-m .title{font-size:150px}
#stage.cjk .ov.biclose .ov-m .title{font-size:130px}
.ov.biclose.play .nbic{animation:lockShut .9s .25s cubic-bezier(.3,1.6,.5,1) both}
@keyframes lockShut{0%{transform:translateY(-30px) scale(.7);opacity:0}60%{transform:translateY(6px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}
.biswitch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:14px}
.biswitch small{display:block;font-weight:500;font-size:12px;color:var(--text-3);margin-top:2px}

/* ---------- admin console ---------- */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);z-index:50;display:flex;flex-direction:column;box-sizing:border-box;background:var(--sheet);border-left:1px solid var(--glass-line);box-shadow:-30px 0 80px rgba(0,0,20,.5);
  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);font-size:15px;color:var(--text);
  font-family:"Montserrat","Gothic A1","Noto Sans SC","Noto Sans JP",Arial,sans-serif}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px}
.sh-head h3{margin:0;font-weight:800;font-size:22px;letter-spacing:.04em}
.sh-head .meta{font-size:12px;color:var(--text-3);letter-spacing:.06em;margin-top:3px}
.sh-tabs{display:flex;gap:6px;padding:0 20px 14px;overflow-x:auto;flex:none}
.sh-tabs button{flex:none;border:0;border-radius:999px;padding:9px 15px;background:rgba(255,255,255,.08);color:var(--text-2);font-weight:700;font-size:13px;cursor:pointer}
.sh-tabs button.on{background:var(--thumb);color:var(--ink)}
.sh-body{flex:1;overflow-y:auto;padding:4px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.grp{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grp h4{margin:0;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase}
.grp.now{background:linear-gradient(180deg,rgba(251,228,162,.14),rgba(251,228,162,.04));border-color:rgba(251,228,162,.35)}
.nowline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nowline b{font-size:24px;font-weight:800}
.mode-pill{padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.16em;background:var(--thumb);color:var(--ink);text-transform:uppercase}
.fld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center}
.fld>label,.fld>.lb{color:var(--text-2);font-size:14px}
.inp{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:var(--text);padding:10px 12px;font-weight:500;font-size:15px;font-family:inherit;min-width:0}
.inp:disabled{opacity:.5}
select.inp option{color:#000;background:#fff}
.inp.num{font-variant-numeric:tabular-nums;text-align:right}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;background:rgba(255,255,255,.12);color:var(--text);transition:transform .12s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}
.btn.big{padding:16px 22px;font-size:16px;width:100%}
.btn.warn{background:rgba(255,255,255,.92);color:var(--ink)}
.btn.rd{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.btn.sm{padding:7px 12px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.spinrow{display:flex;flex-wrap:wrap;gap:8px}
.spinrow button{width:56px;height:56px;border-radius:50%;border:0;font-weight:900;font-size:22px;cursor:pointer;background:rgba(255,255,255,.1);color:var(--text);font-variant-numeric:tabular-nums}
.spinrow button.done{background:rgba(251,228,162,.18);color:var(--gold-hi)}
.spinrow button.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink);box-shadow:0 0 0 3px rgba(251,228,162,.35)}
.spinrow button:disabled{opacity:.4}
.hint{font-size:13px;color:var(--text-3);line-height:1.5;margin:0}
.hint b{color:var(--text-2)}
.note{padding:12px 14px;border-radius:14px;background:rgba(251,228,162,.1);border:1px solid rgba(251,228,162,.3);color:var(--gold-hi);font-size:13px;line-height:1.5}
.tgl{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .25s;justify-self:end;margin:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .25s}
.tgl:checked{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo))}
.tgl:checked::after{transform:translateX(20px)}
.tgl:disabled{opacity:.45}
.segi{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:22px;background:rgba(255,255,255,.08)}
.segi button{flex:1;min-width:52px;border:0;border-radius:999px;padding:9px 10px;background:transparent;color:var(--text-2);font-weight:700;font-size:13px;cursor:pointer}
.segi button.on{background:var(--thumb);color:var(--ink)}
.segi button:disabled{opacity:.45}
.segi button .lv{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold-lo);margin-right:5px;vertical-align:middle}
.ptbl{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) 84px 110px 34px;gap:8px;align-items:center}
.prow.setup{grid-template-columns:78px 104px 84px minmax(0,1fr) 104px}
.prow.hd{font-size:11px;letter-spacing:.16em;color:var(--text-3);font-weight:700;text-transform:uppercase}
.prow .rkc{font-weight:800;font-size:15px;text-align:center;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.prow .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .who b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.prow .who small{font-size:11px;color:var(--text-3);letter-spacing:.1em}
.nbcell{border:0;border-radius:999px;padding:8px 6px;font-weight:800;font-size:11px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--text-3)}
.nbcell.used{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:var(--ink)}
.rule-ed{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:rgba(255,255,255,.04)}
.rulerow{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.3fr) 40px;gap:8px;align-items:center}
.rulerow.tr{grid-template-columns:repeat(3,minmax(0,1fr))}
.pin{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:320px;margin:30px auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);box-sizing:border-box;padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);font-weight:600;font-size:14px;box-shadow:0 14px 40px rgba(0,0,30,.4);animation:toastIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px)}}
@media (max-width:480px){
  .fld{grid-template-columns:1fr}
  .tgl{justify-self:start}
  .rulerow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px}
  .rulerow select{grid-column:1/-1}
  .prow{grid-template-columns:48px minmax(0,1fr) 64px 90px 28px}
  .prow.setup{grid-template-columns:60px 86px 70px minmax(0,1fr)}
  .prow.setup select[data-pl="lang"]{grid-column:1/-1}
  .lk{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? clone(over) : clone(base);
  if (base && typeof base === "object") {
    const out = {};
    for (const k of Object.keys(base)) out[k] = deepMerge(base[k], over && typeof over === "object" ? over[k] : undefined);
    if (over && typeof over === "object" && !Array.isArray(over)) for (const k of Object.keys(over)) if (!(k in base) && over[k] != null) out[k] = clone(over[k]);
    return out;
  }
  return over === undefined || over === null ? base : over;
}
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function readHash(boot) {
  const h = (location.hash || "").toLowerCase();
  const m = h.match(/^#(?:seat|machine|m)(\d{1,2})$/);
  if (m) store("vg_seat", m[1]);
  if (["#lobby", "#audience", "#tv", "#bigscreen"].includes(h)) store("vg_seat", "0");
  if (h === "#admin") adminPinned = true;
  const s = parseInt(load("vg_seat"), 10);
  mySeat = Number.isFinite(s) ? s : 0;
  return h;
}

function overallList() {

/* ---- member lookup through the club's API (settings live on the admin device only) ---- */
function apiCfg() { try { return Object.assign({ url: "", hName: "", hValue: "", tField: "", nField: "" }, JSON.parse(load("vg_api") || "{}")); } catch (e) { return { url: "", hName: "", hValue: "", tField: "", nField: "" }; } }
async function lookupMember(member) {
  const api = apiCfg();
  if (!api.url || !member) return { status: "off" };
  const url = api.url.split("{member}").join(encodeURIComponent(member)) + (api.url.includes("{member}") ? "" : encodeURIComponent(member));
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
  try {
    const headers = { Accept: "application/json" };
    if (api.hName && api.hValue) headers[api.hName] = api.hValue;
    const res = await fetch(url, { headers, signal: ctl.signal });
    if (res.status === 404) return { status: "notfound" };
    if (!res.ok) return { status: "error", detail: "the API answered " + res.status };
    const data = await res.json();
    const pick = list => { for (const path of list.filter(Boolean)) { const v = path.split(".").reduce((o, k) => (o == null ? o : o[k]), data); if (v != null && String(v).trim() !== "") return String(v).trim(); } return ""; };
    const title = pick([api.tField, "title", "salutation", "prefix", "data.title", "data.salutation", "result.title"]);
    const name = pick([api.nField, "lastName", "lastname", "surname", "familyName", "last_name", "name", "data.lastName", "data.surname", "data.name", "result.lastName", "result.name"]);
    if (!title && !name) return { status: "notfound" };
    return { status: "ok", title: normTitle(title), name };
  } catch (e) {
    return { status: "blocked", detail: e && e.name === "AbortError" ? "no answer within 6 seconds" : "this page could not reach the API" };
  } finally { clearTimeout(timer); }
}
function lookupText(r) {
  return r.status === "ok" ? ["ok", `✓ ${[r.title, r.name].filter(Boolean).join(" ")} · from the Member API`]
    : r.status === "notfound" ? ["bad", "Member not found in the API. Type the title and surname."]
    : r.status === "off" ? ["", ""]
    : ["bad", `Lookup failed: ${r.detail}. Type the title and surname.`];
}
function apiView() {

  return `<div class="grp"><h4>Member API</h4>

    ${f("url", "API address", "https://api.example.com/members/{member}")}
    ${f("hName", "Key header (optional)", "x-api-key")}
    ${f("hValue", "Key value (optional)", "••••••", "password")}

    ${f("nField", "Surname field", "lastName")}

  <div class="grp"><h4>Test</h4><div class="fld"><label for="apiTestNo">Member number</label><input class="inp" type="text" inputmode="numeric" id="apiTestNo" placeholder="1234"></div>
    <div class="btns"><button class="btn pri" data-act="apiTest">Look up</button></div><p class="hint" id="apiTestOut"></p></div>
  <div class="note">This browser calls the API directly, so the API must allow CORS from this page's address (or sit behind a proxy on the same domain). The key typed here stays in this admin browser only. If a lookup fails, type Mr/Mdm and the surname in Seat setup.</div>`;
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach(k => { o[k] = o[k] || {}; o = o[k]; }); o[ks[ks.length - 1]] = val; }
function readInput(el) { if (el.type === "checkbox") return el.checked; if (el.type === "number") { const v = parseFloat(el.value); return Number.isFinite(v) ? v : 0; } return el.value; }
function syncView() { if (!demo.on) { cfg = shared.cfg; renderAll(); } }
sheet.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;

    const k = sharedLiveKey(); resetArm = 0; (shared.rounds[k] || { players: [] }).players.forEach(p => p.score = 0); Object.keys(draft).filter(x => x.startsWith(k + ":")).forEach(x => delete draft[x]);
    resetTracking(); editRound(k, 0); refreshSheet(); toast("Scores reset to 0."); return;
  }
  if (act === "rule-add") { (c.rules[rulesEdit] = c.rules[rulesEdit] || []).push({ icon: "info", value: "–", label: "Rule", ko: "", zh: "", ja: "" }); syncView(); saveConfig(0); refreshSheet(); return; }
  if (act === "rule-del") { c.rules[rulesEdit].splice(+b.dataset.i, 1); syncView(); saveConfig(0); refreshSheet(); return; }
  if (act === "full") { goFull(); return; }
  if (act === "glang") { setGuestLang(v); refreshSheet(); return; }
  if (act === "awReplay") { adminChange(x => { x.awardSeq = (+x.awardSeq || 0) + 1; }); return; }
  if (act === "apiTest") {

    if (!no) { out.textContent = "Type a member number first."; return; }
    out.textContent = "Looking up…";

sheet.addEventListener("change", e => {

sheet.addEventListener("input", e => {

sheet.addEventListener("keydown", e => {

function syncRuleTiles(st) {
